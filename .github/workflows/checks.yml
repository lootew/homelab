name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: python -m pip install "pre-commit==4.7.0"

      # The gitleaks hook scans staged changes only, so in CI it would
      # check nothing. Secrets are scanned by the gitleaks job instead.
      # The private hook needs a private config that is not available here.
      - name: Run hooks
        env:
          SKIP: gitleaks,gitleaks-private
        run: pre-commit run --all-files --show-diff-on-failure

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 \
            -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      - name: Scan full Git history
        run: gitleaks git --config .gitleaks.toml --redact --verbose .

  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tofu: ${{ steps.diff.outputs.tofu }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Decide whether OpenTofu checks are needed. A skipped job reports
      # success, so the opentofu check can be required without blocking
      # pull requests that do not touch OpenTofu code.
      - name: Detect OpenTofu changes
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="${PR_BASE_SHA}...${PR_HEAD_SHA}"
          else
            range="${PUSH_BEFORE_SHA}..${PUSH_AFTER_SHA}"
          fi

          # Unknown base (should not happen on main): run the checks.
          if ! changed="$(git diff --name-only "$range" -- terraform/ .github/workflows/checks.yml)"; then
            echo "Cannot diff ${range}, running OpenTofu checks"
            echo "tofu=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$changed" ]; then
            printf 'Changed OpenTofu-related files:\n%s\n' "$changed"
            echo "tofu=true" >> "$GITHUB_OUTPUT"
          else
            echo "No OpenTofu-related changes"
            echo "tofu=false" >> "$GITHUB_OUTPUT"
          fi

  opentofu:
    needs: changes
    if: needs.changes.outputs.tofu == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.13.2"
          tofu_wrapper: false
          checksums: |
            723bebb0df8411daff1e5fc3862e28ff5581fe5634087f4c29a9aa41d78208b5

      - name: Check formatting
        run: tofu fmt -check -recursive -diff terraform/

      # No backend and no secrets: only syntax, types and provider schemas.
      - name: Validate modules
        run: |
          for dir in terraform/*/; do
            echo "::group::${dir}"
            tofu -chdir="$dir" init -backend=false -input=false
            tofu -chdir="$dir" validate
            echo "::endgroup::"
          done
